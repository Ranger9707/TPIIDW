<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Salones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container my-5">
    <h1 class="mb-4 text-center">Editor de Salones</h1>

    <div class="mb-4 text-center">
        <a href="salones.html" class="btn btn-outline-primary">
            Volver a salones
        </a>
    </div>

    <div class="mb-4">
        <input type="text" id="buscarInput" class="form-control" placeholder="Buscar salon">
    </div>

    <form id="salonForm" class="mb-5">
        <input type="hidden" id="salonId">
        <div class="row mb-3">
            <div class="col-md-6 mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Direccion</label>
                <input type="text" id="direccion" class="form-control" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Descripcion</label>
            <textarea id="descripcion" class="form-control" rows="2" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">URLs de Img</label>
            <input type="text" id="imagenes" class="form-control" required>
        </div>
        <div class="d-grid gap-2 d-md-flex justify-content-md-start">
            <button type="submit" class="btn btn-success me-md-2">Guardar/Agregar</button>
            <button type="reset" class="btn btn-secondary" onclick="resetForm()">Cancelar</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Direccion</th>
                    <th>Imagen</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaSalones"></tbody>
        </table>
    </div>

    <script type="module">
        import { inicializarAdminSalones } from './salonesjava.js';
        inicializarAdminSalones();
    </script>
</body>

</html>
