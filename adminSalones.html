<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container my-5">
    <h1 class="mb-4 text-center">Panel de Administración</h1>
    <div class="mb-4 text-center">
        <a href="index.html" class="btn btn-outline-primary">Volver al Inicio</a>
    </div>

    <ul class="nav nav-tabs" id="adminTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="salones-tab" data-bs-toggle="tab" data-bs-target="#salones-tab-pane"
                type="button" role="tab" aria-controls="salones-tab-pane" aria-selected="true">Gestionar Salones</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="servicios-tab" data-bs-toggle="tab" data-bs-target="#servicios-tab-pane"
                type="button" role="tab" aria-controls="servicios-tab-pane" aria-selected="false">Gestionar Servicios</button>
        </li>
    </ul>

    <div class="tab-content" id="adminTabContent">

        <div class="tab-pane fade show active" id="salones-tab-pane" role="tabpanel" aria-labelledby="salones-tab" tabindex="0">
            <div class="p-3 border border-top-0">
                <h2 class="h4 mt-3">Editor de Salones</h2>
                <div class="mb-4">
                    <input type="text" id="buscarInput" class="form-control" placeholder="Buscar salón por nombre...">
                </div>
                <form id="salonForm" class="mb-5">
                    <input type="hidden" id="salonId">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" id="nombreSalon" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccion" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea id="descripcionSalon" class="form-control" rows="2" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URLs de Imágenes (separadas por coma)</label>
                        <input type="text" id="imagenes" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success">Guardar/Agregar Salón</button>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Dirección</th>
                                <th>Imagen</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaSalones"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="servicios-tab-pane" role="tabpanel" aria-labelledby="servicios-tab" tabindex="0">
            <div class="p-3 border border-top-0">
                <h2 class="h4 mt-3">Editor de Servicios</h2>
                <form id="servicioForm" class="mb-5">
                    <input type="hidden" id="servicioId">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Servicio</label>
                        <input type="text" id="nombreServicio" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea id="descripcionServicio" class="form-control" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL de la Imagen</label>
                        <input type="text" id="imagenServicio" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success">Guardar/Agregar Servicio</button>
                </form>

                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Imagen</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaServicios"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script>

</body>

</html>
