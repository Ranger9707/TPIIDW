<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Salones - IDW S.A</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href= "css/estilos.css"
</head>
<body class="d-flex flex-column min-vh-100">

<header>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="Recursos/logo.jpg" alt="Logo IDW" width="100" height="100" class="d-inline-block align-text-top">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
              aria-label="Alternar navegación">
          <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link active" href="salones.html">Salones</a></li>
            <li class="nav-item"><a class="nav-link" href="institucional.html">Información Institucional</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="container my-5 flex-grow-1">
    <h2 class="text-center mb-4">Galería de Salones de Eventos</h2>
    <div class="row g-4" id="contenedor-salones"></div>
</main>

    <footer class="footer-custom text-white text-center py-3 mt-auto">
    <p class="mb-0">&copy; 2025 IDW. Todos los derechos reservados.</p>
    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { inicializarSalones, obtenerSalones } from './salonesjava.js';

document.addEventListener("DOMContentLoaded", () => {
    inicializarSalones();

    const salones = obtenerSalones();
    const contenedor = document.getElementById('contenedor-salones');

    salones.forEach((salon) => {
        const div = document.createElement('div');
        div.className = 'col-md-4';

        div.innerHTML = `
        <div class="card h-100 shadow-sm">
            <div id="carouselSalones${salon.id}" class="carousel slide mb-3" data-bs-ride="carousel">
                <div class="carousel-inner">
                    ${salon.imagenes.map((img, i) => `
                        <div class="carousel-item ${i === 0 ? 'active' : ''}">
                            <img src="${img}" class="d-block w-100" alt="${salon.nombre} - Imagen ${i + 1}">
                        </div>`).join('')}
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselSalones${salon.id}" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselSalones${salon.id}" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>
            </div>

            <div class="card-body d-flex flex-column">
                <h5 class="card-title">${salon.nombre}</h5>
                <p class="card-text">${salon.descripcion}</p>
                <p><strong>Dirección:</strong> ${salon.direccion}</p>
                <a href="reserva.html?salon=${salon.id}" class="btn btn-primary mt-auto">
                    <i class="fas fa-calendar-check"></i> Reservar ahora
                </a>
            </div>
        </div>`;

        contenedor.appendChild(div);
    });
});
</script>

</body>
</html>
