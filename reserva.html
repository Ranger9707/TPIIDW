<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva y Presupuesto - IDW S.A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <header>
        </header>
    <main class="container my-5 flex-grow-1">
        <h2 class="text-center mb-4">Formulario de Reserva y Presupuesto</h2>
        <div class="row g-5">
            <div class="col-lg-7">
                <h3 id="nombre-salon-titulo">Cargando salón...</h3>
                <form id="formReserva">
                    <h5>1. Tus Datos</h5>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <hr>
                    <h5>2. Fecha del Evento</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fecha" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fecha" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="horario" class="form-label">Horario</label>
                            <input type="time" class="form-control" id="horario" required>
                        </div>
                    </div>
                    <hr>
                    <h5>3. Servicios Adicionales (Opcional)</h5>
                    <div id="contenedor-servicios">
                        </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4">
                        <i class="fas fa-paper-plane"></i> Enviar Reserva
                    </button>
                </form>
            </div>
            <div class="col-lg-5">
                <div class="card shadow-sm sticky-top" style="top: 120px;">
                    <div class="card-header">
                        <h4 class="mb-0"><i class="fas fa-file-invoice-dollar me-2"></i>Presupuesto en Vivo</h4>
                    </div>
                    <div class="card-body" id="presupuesto-detalle">
                        </div>
                    <div class="card-footer bg-dark text-white">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">TOTAL</h5>
                            <h5 class="mb-0" id="presupuesto-total">$0</h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer-custom text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2025 IDW. Todos los derechos reservados.</p>
    </footer>
    <script type="module" src="js/reserva.js"></script>
</body>
</html>
