<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Salones - IDW S.A</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="Recursos/logo.jpg" alt="Logo IDW" width="100" height="100">
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <h2 class="text-center mb-4">Formulario de Reserva</h2>
        <form id="formReserva" class="mx-auto" style="max-width: 600px;">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha de reserva</label>
                <input type="date" class="form-control" id="fecha" required>
            </div>
            <div class="mb-3">
                <label for="horario" class="form-label">Horario</label>
                <input type="time" class="form-control" id="horario" required>
            </div>
            <div class="mb-3">
                <label for="salon" class="form-label">ID del salón</label>
                <input type="text" class="form-control" id="salon" readonly>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-paper-plane"></i> Enviar Reserva
            </button>
        </form>
    </main>

    <footer class="footer-custom text-white text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2025 IDW. Todos los derechos reservados.</p>
    </footer>

    <script src="js/reserva.js"></script>
</body>

</html>
