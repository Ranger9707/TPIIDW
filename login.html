
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - IDW S.A</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-4 shadow" style="min-width: 300px;">
    <h3 class="text-center mb-3">Iniciar Sesión</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario" required>
        </div>
        <div class="mb-3">
            <label for="clave" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="clave" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
    <div id="mensajeError" class="text-danger text-center mt-2" style="display: none;">
        Usuario o contraseña incorrectos
    </div>
</div>

<div class="alert alert-info mt-4" role="alert">
  <strong>Usuario:</strong> <code>admin</code><br>
  <strong>Contraseña:</strong> <code>1234</code>
</div>

<div class="text-center mt-3">
  <a href="index.html" class="btn btn-outline-secondary">
    Volver al Inicio
  </a>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const usuario = document.getElementById("usuario").value.trim();
    const clave = document.getElementById("clave").value.trim();

    if (usuario === "admin" && clave === "1234") {
        localStorage.setItem("logueado", "true");
        window.location.href = "adminSalones.html";
    } else {
        document.getElementById("mensajeError").style.display = "block";
    }
});
</script>

</body>
</html>
