<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login - IDW S.A</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column justify-content-center align-items-center min-vh-100">

    <div class="container" style="max-width: 400px;">
        <div class="card p-4 shadow-sm">
            <h3 class="text-center mb-3">Iniciar Sesión</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="usuario" required>
                </div>
                <div class="mb-3">
                    <label for="clave" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="clave" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            </form>
            <div id="mensajeError" class="text-danger text-center mt-2" style="display: none;">
                Usuario o contraseña incorrectos
            </div>
        </div>

        <div class="alert alert-info mt-3 text-center">
            <strong>Usuario:</strong> <code>admin</code><br>
            <strong>Contraseña:</strong> <code>1234</code>
        </div>

        <a href="index.html" class="btn btn-outline-secondary mt-2 w-100">Volver al Inicio</a>
    </div>

    <script src="login.js"></script>

</body>

</html>
